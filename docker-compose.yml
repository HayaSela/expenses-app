version: '3.8'

services:
  db:
    image: postgres:15
    container_name: expense_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: expensedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: expense_app
    ports:
      - "8502:8501" 
    volumes:
      - .:/app    # <--- זו השורה שמאפשרת לאפליקציה להתעדכן בלייב!
    depends_on:
      - db

volumes:
  postgres_data: